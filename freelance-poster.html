<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance UI/UX Poster | Thy Hongkry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-blue: #1d61e7;
            --preview-bg: #e2e8f0;
        }

        body.dark-theme {
            --bg-color: #0b1329;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --preview-bg: #182548;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 10%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .btn-back, .theme-toggle {
            cursor: pointer;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover, .theme-toggle:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        .project-header {
            text-align: center;
            padding: 2rem 10%;
            max-width: 900px;
            margin: 0 auto;
        }

        .project-header span {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
        }

        .project-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .poster-display {
            max-width: 800px;
            margin: 0 auto 4rem;
            padding: 0 2rem;
        }

        .poster-display img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-color);
        }

        .project-info {
            max-width: 800px;
            margin: 0 auto 5rem;
            padding: 0 2rem;
            text-align: center;
        }

        .project-info h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 10%;
            display: flex;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .project-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <!-- This link takes you back to your main portfolio page. Change index.html if your main file is named differently -->
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>
    </header>

    <div class="project-header">
        <span>Graphic Design</span>
        <h1> Poster Design</h1>
    </div>

    <div class="poster-display">
        <!-- Make sure poster.png is in the same folder -->
        <img src="poster.png" alt="Freelance UI/UX Design Promotional Poster">
    </div>

    <footer>
        <div>© All Rights Reserved • Thy Hongkry</div>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');

            if (document.body.classList.contains('dark-theme')) {
                themeIcon.classList.remove('fa-sun', 'fa-solid');
                themeIcon.classList.add('fa-moon', 'fa-regular');
            } else {
                themeIcon.classList.remove('fa-moon', 'fa-regular');
                themeIcon.classList.add('fa-sun', 'fa-solid');
            }
        });
    </script>
</body>
</html>
