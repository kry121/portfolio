<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer E-Commerce App | Thy Hongkry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Default Light Theme Variables */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-blue: #1d61e7;
            --accent-hover: #154ec2;
            --grid-line: rgba(0, 0, 0, 0.04);
            --preview-bg: #e2e8f0;
        }

        /* Dark Theme Overrides */
        body.dark-theme {
            --bg-color: #0b1329;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --grid-line: rgba(255, 255, 255, 0.04);
            --preview-bg: #182548;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Top Header just for the theme toggle now */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 2rem 10% 0;
            max-width: 1400px;
            margin: 0 auto;
        }

        .theme-toggle {
            cursor: pointer;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Project Intro Section (Matches your screenshot) */
        .project-intro {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 10% 2rem;
        }

        .back-link {
            color: var(--accent-blue);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2.5rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-hover);
        }

        .project-intro h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .figma-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-blue);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        .figma-btn:hover {
            background: var(--accent-hover);
        }

        /* Single Image Container */
        .single-image-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10% 4rem;
        }

        .single-image-container img {
            width: 100%;
            height: auto;
            border-radius: 16px; /* Slightly softer corners like your screenshot */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: block;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 10%;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .project-intro h1 { font-size: 1.8rem; }
            .single-image-container, .project-intro { padding-left: 5%; padding-right: 5%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>
    </header>

    <div class="project-intro">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
        
        <h1>CUSTOMER E-COMMERCE APP — UI/UX CASE STUDY</h1>
        
        <a href="https://www.figma.com/design/3Taehxh509rES8JBqdgB5S/Customer-App?node-id=1-5&t=nDMFnnEkiZtxEzr5-1" target="_blank" class="figma-btn">
            <i class="fa-brands fa-figma"></i> Open Figma Design
        </a>
    </div>

    <main class="single-image-container">
        <img src="your-big-project-image.png" alt="Customer E-Commerce Full Case Study">
    </main>

    <footer>
        <div>© All Rights Reserved • Thy Hongkry</div>
    </footer>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');

            if (document.body.classList.contains('dark-theme')) {
                themeIcon.classList.remove('fa-sun', 'fa-solid');
                themeIcon.classList.add('fa-moon', 'fa-regular');
            } else {
                themeIcon.classList.remove('fa-moon', 'fa-regular');
                themeIcon.classList.add('fa-sun', 'fa-solid');
            }
        });
    </script>
</body>
</html>
